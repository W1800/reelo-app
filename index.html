<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reelo</title>
<style>
  body { font-family: sans-serif; background:#0d1117; color:#fff; display:flex; justify-content:center; padding:24px; margin:0; }
  .box { width:100%; max-width:420px; }
  h1 { text-align:center; }
  input, button { width:100%; padding:14px; margin-top:12px; border-radius:10px; border:0; font-size:16px; box-sizing:border-box; }
  input { background:#161b22; color:#fff; }
  button { background:#e1306c; color:#fff; font-weight:bold; }
  #msg { margin-top:14px; text-align:center; }
</style>
</head>
<body>
<div class="box">
  <h1>Reelo</h1>
  <input id="url" placeholder="الصق رابط انستقرام هنا">
  <button id="btn">تنزيل</button>
  <div id="msg"></div>
</div>
<script>
  // بعد نشر الخادم، غيّر هذا الرابط لرابط خادمك
  const SERVER = "https://YOUR-SERVER.onrender.com";

  document.getElementById("btn").onclick = async () => {
    const url = document.getElementById("url").value.trim();
    const msg = document.getElementById("msg");
    if (!url) { msg.textContent = "الصق الرابط أول"; return; }
    msg.textContent = "جاري التنزيل...";
    try {
      const r = await fetch(SERVER + "/download", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url })
      });
      if (!r.ok) {
        const e = await r.json();
        msg.textContent = e.error || "صار خطأ";
        return;
      }
      const blob = await r.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "reelo.mp4";
      a.click();
      msg.textContent = "تم التنزيل ✅";
    } catch (e) {
      msg.textContent = "تعذر الاتصال بالخادم";
    }
  };
</script>
</body>
</html>
